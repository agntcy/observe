---
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch: {}

exporters:
  otlp/event-exporter:
    endpoint: "http://host.docker.internal:4417"   # host:port event-exporter is listening on
    tls:
      insecure: true            # event-exporter serves plain gRPC, no TLS
  clickhouse:
    endpoint: "tcp://clickhouse-server:9000"
    database: "default"
    username: "admin"
    password: "admin"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [clickhouse]

    traces:
      receivers: [otlp]
      exporters: [clickhouse]

    logs:
      receivers: [otlp]
      exporters: [otlp/event-exporter, clickhouse]
