[project]
name = "mcp-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavan Sudheendra", email = "pavan0591@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ioa-observe-sdk",
    "langchain[mcp]>=1.4.2",
    "langchain-openai>=1.6.5",
    "mcp>=2.2.0,<3",
    "python-dotenv>=1.1.1",
]

[tool.uv.sources]
ioa-observe-sdk = {path = "../../", editable=true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_examples"]